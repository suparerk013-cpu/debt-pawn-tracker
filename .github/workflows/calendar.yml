name: Update Google Calendar feeds

# Every 3 hours. Google Calendar itself only re-reads a subscribed feed every few hours,
# so running more often would not make events show up any sooner.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy even if the feeds look unchanged'
        type: boolean
        default: false

concurrency:
  group: calendar-feed
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin@12 --no-save --no-audit --no-fund

      - name: Build calendar feeds
        id: build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/build-calendars.js

      # Deploys the whole site from main (plus the generated cal/ files), the same thing a
      # manual `firebase deploy --only hosting` does. The service account needs the
      # "Firebase Hosting Admin" role in Google Cloud IAM for this step.
      - name: Deploy to Firebase Hosting
        if: steps.build.outputs.changed == 'true' || inputs.force_deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting --non-interactive --project debt-pawn-tracker-cc106
